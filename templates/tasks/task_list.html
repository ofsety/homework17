{% extends "base.html" %}

{% block content %}
<h2>My tasks</h2>

<a href="{% url 'task_create' %}">Create task</a>

<ul>
    {% for task in tasks %}
        <li>
                {% csrf_token %}
                <input type="checkbox" {% if task.is_completed %} checked {% endif %} onchange="this.form.submit()">

            
            </form>
        
    {% empty %}
        <li>No tasks yet</li>
    {% endfor %}
</ul>
{% endblock %}
